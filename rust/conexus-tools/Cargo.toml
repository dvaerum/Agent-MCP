[package]
name = "conexus-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus MCP tool catalogue -- one module per agent_mcp/tools/*.py (Phase D). See /home/dennis/.claude/plans/prancy-napping-pie.md."

[dependencies]
conexus-core = { path = "../conexus-core" }
conexus-db = { path = "../conexus-db" }
conexus-auth = { path = "../conexus-auth" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
regex = "1"
# Tool::call takes `&tokio::sync::Mutex<Connection>` (see
# conexus_auth::tool's module doc) -- every impl here locks it as the
# first step of its own async body.
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
# RAG's embedding/completion/context-window HTTP calls (Phase D2). Same
# feature set as this repo's own aoe-bridge/Cargo.toml (rustls-tls:
# AoE deliberately avoids an OpenSSL system dependency; that reasoning
# applies here too).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
] }

[dev-dependencies]
# Union of both features sets that need a runtime in tests: driving an
# async Tool::call/dispatch ("rt", "macros") and the embedding/
# completion/context-window probe tests' real bound TCP listeners
# ("rt-multi-thread", "net", "io-util") -- "rt-multi-thread" is a
# superset of "rt" so only one is listed.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
