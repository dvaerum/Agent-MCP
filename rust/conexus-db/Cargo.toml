[package]
name = "conexus-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus data layer — unifies agent_mcp's 8 Python repositories into one rusqlite crate (Phase B). See /home/dennis/.claude/plans/prancy-napping-pie.md."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off + only "std": this crate never reads the wall
# clock (see agent_repository.rs's module doc on that design rule) --
# chrono is used purely for ISO-8601 parsing/arithmetic/formatting in
# scheduled_directive_repository's interval math, not Utc::now().
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
# Only needed to register the real sqlite-vec extension for THIS
# crate's own rag_repository tests -- production rag_repository code
# never calls into conexus-vec itself (it only checks whether
# `rag_embeddings` exists in sqlite_master, a plain SQL query), so
# this stays a dev-dependency, not a real one.
conexus-vec = { path = "../conexus-vec" }

[[bin]]
name = "conexus-db-differential"
path = "src/bin/conexus-db-differential.rs"
