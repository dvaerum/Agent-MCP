[package]
name = "conexus-router"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus always-on URL-keyed router binary (Phase E2). See /home/dennis/.claude/plans/prancy-napping-pie.md."

[[bin]]
name = "conexus-router"
path = "src/main.rs"

[dependencies]
# Guiding Principle 2 / ADR-0020: NEVER conexus-tools or conexus-mcp,
# so the router stays structurally incapable of importing a tool type
# (a compile-time guarantee of "the router is mount-agnostic", not
# just a convention). conexus-auth (forwarding_header signing) isn't
# a dependency yet -- no real consumer until the proxy-core PR.
conexus-core = { path = "../conexus-core" }
conexus-db = { path = "../conexus-db" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# identity.rs's password hashing (Phase E2 PR 3) -- the RustCrypto
# project's own argon2 crate, matching Python's argon2-cffi's library
# defaults (argon2id, t=2, m=64MiB, p=4) and producing/parsing the
# same PHC string format, so a hash minted by one implementation
# verifies under the other. No existing workspace precedent for this
# choice (same "genuinely new, no fork to resolve" shape as the
# crane-vs-buildRustPackage pick in Phase D1).
argon2 = "0.6"
# session_id/user_id generation -- same OS-CSPRNG source
# `conexus-tools::admin_tools::generate_token` already uses.
getrandom = "0.4"
# project_registry.rs (Phase E2 PR 5) needs the raw JSON map shape
# Python's `dict[str, Any]` gives it (to round-trip opaque `extra`
# fields on a read-modify-write cycle without a schema) plus its slug
# validation regex -- both already workspace dependencies elsewhere
# (conexus-core/conexus-tools use serde_json; conexus-db uses regex),
# added here directly rather than routed through another crate's
# private re-export.
serde_json = "1"
regex = "1"
# Advisory cross-process file locking for the registry's sidecar
# lockfile (`<path>.lock`) -- ports `fcntl.flock`'s LOCK_EX/LOCK_SH
# semantics. No existing workspace precedent for this choice (same
# "genuinely new, no fork to resolve" shape as the argon2 pick in
# PR 3): `fd-lock` is small, actively maintained, and its `RwLock`
# read/write split maps directly onto LOCK_SH/LOCK_EX.
fd-lock = "4"
# Atomic registry-file rewrite (tmp-in-same-dir + fsync + rename) --
# same crate+version already used by identity.rs's own create_user
# race test (see below), here as a REAL (not dev) dependency since
# production code needs it, not just tests.
tempfile = "3"
