[package]
name = "conexus-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus pure domain types (Capability, Principal, ToolResult, ...) — zero I/O, zero framework dependency. Phase A of the Python->Rust migration; see /home/dennis/.claude/plans/prancy-napping-pie.md."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# string_sanitize's hidden-Unicode/combining-mark classification --
# same crate + version aoe-bridge/conexus-backend::json_sanitize
# already use, moved here (Phase E2 PR 3) so conexus-router can share
# the identical stripper instead of a second, drift-risking copy.
unicode-general-category = "1.1.0"
