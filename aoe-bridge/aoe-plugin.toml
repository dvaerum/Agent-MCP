# agent-mcp delivery bridge — Agent of Empires plugin manifest.
#
# Schema reference: aoe-plugin-api (PluginManifest), docs/plugin-api.md.
# api_version 13 is required for the `session.mcp` capability / `session.mcp.set`
# RPC (the per-session-MCP host patch). The `object_list` settings widget used
# by the per-session mapping (`sessions`) needs ≥9; 13 covers both.

id = "dev.dvaerum.agent-mcp-delivery"
name = "agent-mcp Delivery Bridge"
version = "0.1.0"
api_version = 13
description = "Injects agent-mcp delivery notifications into AoE-run sessions that don't poll wait_for_events (ADR-0021): subscribes to each covered session's delivery SSE stream, reports transport-status up, injects skinny (id/subject/status only) nudges via AoE's /send and /acp/prompt routes, and (optionally) wires agent-mcp's tools into each covered session as a per-session MCP server."

# runtime.worker: run the worker at all (and the config.get host RPC).
# session.read:   sessions.list, to enumerate live sessions + their status.
# session.mcp:    session.mcp.set, to inject agent-mcp's tools per session.
# net:            outbound HTTP/SSE to agent-mcp and AoE's localhost REST.
# notifications:  ui.notify, to surface bridge errors to the operator.
capabilities = ["runtime.worker", "session.read", "session.mcp", "net", "notifications"]

# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------

[[commands]]
id = "status"
title = "agent-mcp Delivery: status"
description = "Report that the delivery bridge worker is running."

# ---------------------------------------------------------------------------
# Settings — read by the worker over the config.get host RPC.
# ---------------------------------------------------------------------------

[[settings]]
key = "enabled"
label = "Enable delivery bridge"
description = "Master switch. When off, the worker holds no streams and reports no status."
type = "boolean"
default = true

# ── agent-mcp side ──────────────────────────────────────────────────────────
# The ONE agent-mcp URL to configure. Every per-session URL is derived from it:
#   delivery = <agent_mcp_base>/api/<project>   (SSE stream + status POST)
#   mcp      = <agent_mcp_base>/mcp/<project>   (injected per-session MCP server)
[[settings]]
key = "agent_mcp_base"
label = "agent-mcp base URL"
description = "The agent-mcp router's base URL. Use the BARE address you reach it at — on the same host that's http://127.0.0.1:1337, with NO /agent-mcp. The /agent-mcp prefix is a reverse-proxy concern (a front door may serve the router under it externally); it does not belong in this base. The bridge derives each covered session's delivery URL (<base>/api/<project>) and MCP URL (<base>/mcp/<project>) from this plus the row's project. Blank ⇒ the bridge covers nothing."
type = "string"
default = ""

# ── AoE side (the injection target — a DIFFERENT service from agent-mcp) ─────
[[settings]]
key = "aoe_base"
label = "AoE serve base URL (injection target)"
description = "Base URL of THIS AoE serve instance's REST API — where the bridge POSTs a nudge to inject it into a session (/api/sessions/<id>/send or /acp/prompt). This is the AoE side, not agent-mcp."
type = "string"
default = "http://127.0.0.1:8080"

[[settings]]
key = "aoe_token"
label = "AoE serve token"
description = "Bearer token for THIS AoE serve instance (from ~/.agent-of-empires/serve.url), if it runs with auth. Leave blank for a --auth=none instance."
type = "string"
default = ""
advanced = true

[[settings]]
key = "status_interval_secs"
label = "Status/reconcile interval (seconds)"
description = "How often the bridge re-resolves routes and re-posts each session's transport-status."
type = "integer"
default = 30
min = 5
max = 3600
advanced = true

[[settings]]
key = "ensure_acp"
label = "Switch covered sessions to ACP mode"
description = "On (default): every covered session that gets agent-mcp's tools injected (expose_mcp on) is also switched to ACP mode, so AoE's per-session MCP actually reaches the agent. Terminal claude/opencode sessions never load per-session MCP; ACP delivers it agent-agnostically. This is a one-time terminal→ACP view swap per session (transcript-preserving), applied only to sessions whose agent is ACP-capable. Off: sessions are left in their current mode and per-session MCP may not apply to terminal agents."
type = "boolean"
default = true

# ── Covered sessions ────────────────────────────────────────────────────────
# One row per session the bridge covers. A row is just identity — session_id,
# token, project — no URL (those derive from agent_mcp_base above).
[[settings]]
key = "sessions"
label = "Covered sessions"
description = "Sessions the bridge covers. Each row is an AoE session id + the agent-mcp token and project it acts as. The delivery and MCP URLs are derived from 'agent-mcp base URL' + project, so there's no URL to enter here."
type = "object_list"
max_items = 200

[[settings.fields]]
key = "session_id"
label = "AoE session id"
description = "The session to cover. Matches sessions.list[].id (stable across respawn)."
type = "string"
required = true

[[settings.fields]]
key = "token"
label = "agent-mcp token"
description = "The session's agent-mcp bearer (mint one via agent-mcp's Register Agent). Authenticates BOTH the delivery stream and the injected MCP tools."
type = "string"
required = true

[[settings.fields]]
key = "project"
label = "agent-mcp project"
description = "The agent-mcp project this session acts as. Appended to the global agent-mcp base for both its delivery (/api/<project>) and MCP (/mcp/<project>) URLs."
type = "string"
required = true

[[settings.fields]]
key = "expose_mcp"
label = "Also inject agent-mcp tools (MCP)"
description = "On: also wire agent-mcp's tools into this session as a per-session MCP server. Off: delivery-push only. First enable respawns the session once (transcript-preserving) to load the tools."
type = "boolean"
default = true

[[settings.fields]]
key = "mode"
label = "Injection mode"
description = "How a nudge is delivered. auto infers terminal vs structured from the live session; set explicitly for ACP/CityHall/composer sessions."
type = "select"
options = ["auto", "terminal", "structured"]
default = "auto"

# ---------------------------------------------------------------------------
# Runtime worker — built from source into .aoe-build/ (excluded from the plugin
# integrity hash) and launched as a plugin-relative binary.
# ---------------------------------------------------------------------------

[runtime]
kind = "command"
command = [".aoe-build/target/release/aoe-bridge-worker"]

[[runtime.build]]
command = ["cargo", "build", "--release", "--target-dir", ".aoe-build/target"]
platforms = ["linux", "macos"]
