name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo (checkout,
# build, test) and never writes back, so drop the default read/write grant.
permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every CPython release still receiving updates as of the floor
        # bump (3.10 reaches EOL 2026-10-31 and was dropped with it).
        # These four jobs run in parallel with the four Nix VM shards
        # below — GitHub schedules all jobs concurrently, bounded only by
        # the runner pool, so the full matrix costs no extra wall-clock on
        # a single run.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        # v7 is the newest moving major tag astral publishes (v8 is
        # release-only for now); both run on node24.
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Cache uv's wheel/download store to cut the cold install.
          # cache-suffix keys the cache per matrix Python so the four
          # jobs don't race to reserve one shared key (setup-uv's
          # default key omits the matrix version — that was the earlier
          # "Unable to reserve cache" warning). Invalidates on
          # pyproject.toml change via the default cache-dependency-glob.
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint (tests/ only)
        # Scope is tests/ for now; agent_mcp/ has ~2300 pre-existing ruff
        # errors documented in CONTRIBUTING.md. PRs that touch agent_mcp/
        # files clean them up incrementally.
        run: uv run ruff check tests/

      - name: Run pytest
        # `-n auto` (one worker per CPU) is configured in pyproject.toml
        # under [tool.pytest.ini_options] addopts; pytest-xdist comes
        # in via `.[dev]` above. GitHub ubuntu-latest runners give us
        # ~4 cores, which is the sweet spot for this suite.
        run: uv run pytest -v

  aoe-bridge:
    # The AoE delivery-bridge plugin worker (ADR-0021). It is a standalone
    # crate consumed by the nix deploy as a flake-input source path, so nothing
    # else in this workflow compiles it — without this job a Rust change ships
    # unverified and only breaks at `nixos-rebuild` time (the deploy's crane
    # build runs `doCheck`, i.e. these same tests, but hours later).
    name: aoe-bridge (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aoe-bridge
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust toolchain
        # `stable` satisfies the crate's declared rust-version floor (1.85).
        # `rustup default` pins what bare `cargo` resolves to, so fmt/clippy
        # cannot silently run under a different toolchain than the tests.
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aoe-bridge/target
          key: aoe-bridge-${{ runner.os }}-${{ hashFiles('aoe-bridge/Cargo.lock') }}
          restore-keys: aoe-bridge-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  dashboard:
    # Job display name is load-bearing: branch protection matches
    # required status checks by name, so renaming it would silently stop
    # satisfying an existing requirement. The added vitest step is a
    # step-level change on purpose.
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_mcp/dashboard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_mcp/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Vitest suite was ungated until fix/vitest-notifications-flake,
      # which is exactly why a testTimeout bump papering over two real
      # timer/import defects went unnoticed for a release: nothing outside
      # a developer's own terminal ever ran it. `npm run build` only
      # typechecks — it cannot catch a leaked timer, a lost SSE contract,
      # or a source-grep guard going stale.
      #
      # Cost is ~20s on top of a job that already pays for `npm ci`, so it
      # runs BEFORE the (much slower) build for fast feedback.
      - name: Unit tests (vitest)
        run: npm test

      - name: Build static export
        run: npm run build

  nix-flake-check:
    # Sharded: each of the four nixosTest VMs builds on its own runner in
    # parallel, so the job's wall-clock is a single VM (~4-6 min warm)
    # instead of four serialized on one runner (~9 min). fail-fast:false
    # so one VM's failure still lets the others report. All four stay
    # gated so a VM check can't silently rot (event-driven-coord +
    # no-auto-cleanup were previously ungated and drifted — see #489). The
    # VM checks exercise the full server boot + HTTP assertions (including
    # the Path A asset-prefix sentinel regression guard from #166) which
    # nothing else covers. The agent-mcp Python build + dashboard Next.js
    # build are NOT gated here — the `python` and `dashboard` jobs above
    # cover those.
    name: Nix VM (${{ matrix.vm }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vm:
          - vm-single-tenant
          - vm-multi-tenant
          - vm-event-driven-coord
          - vm-no-auto-cleanup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Pinned to a release tag instead of the mutable @main for
      # reproducible runs; v22 runs on node24.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # Resilience: retry transient substituter/network hiccups
          # before giving up, rather than failing the job on the first
          # flaky download from cache.nixos.org. Pairs with --fallback
          # on the build step below.
          extra-conf: |
            download-attempts = 3
            connect-timeout = 10

      # magic-nix-cache is sunset by Determinate Systems (it also spammed
      # an "Unable to authenticate to FlakeHub" annotation on every run)
      # and, when GitHub Actions Cache throttled it, disabled the
      # substituter mid-build and hard-failed the job (HTTP 418 /
      # ResourceExhausted). cache-nix-action save/restores /nix/store via
      # the plain Actions cache API instead, with GC so we stay under the
      # 10 GB per-repo cache budget. No external account or secret needed.
      - name: Cache /nix/store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Per-VM cache lineage: each shard keys on ``matrix.vm`` so the
          # four parallel shards don't collide on one shared ``run_id``
          # key, and each cache holds only its own VM closure.
          primary-key: nix-${{ runner.os }}-${{ matrix.vm }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}-${{ github.run_id }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.vm }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}-
          # Trim each shard's store to ~3 GB before saving so the four
          # per-VM lineages stay near the 10 GB per-repo budget. If GitHub
          # LRU-evicts one, that shard just re-substitutes from
          # cache.nixos.org next run (still faster than the un-sharded job).
          gc-max-store-size-linux: 3G
          # Keep each lineage bounded: drop this VM's older entries, but
          # never the key we're about to save. Scoped to the per-VM prefix
          # so one shard's purge never evicts a sibling VM's cache.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.vm }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build VM test
        # --fallback: if a binary-cache substitution fails (flaky
        # cache.nixos.org), build that path from source instead of
        # hard-failing the job. With download-attempts=3 above, this
        # makes the shard resilient to transient cache failures — the
        # class of flake that sank the old magic-nix-cache setup.
        run: |
          nix build .#checks.x86_64-linux.${{ matrix.vm }} \
                    -L --print-build-logs --fallback

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # --- Python: pip-audit against the uv-locked dependency tree ---
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: audit

      - name: Export locked requirements
        # Audit the exact resolved tree from uv.lock (no project install
        # needed) so the gate reflects what actually ships, transitive
        # deps included. --no-emit-project drops the local agent-mcp
        # package (not on PyPI, unauditable anyway).
        # --locked hard-fails on pyproject.toml <-> uv.lock drift instead
        # of silently re-resolving and auditing a tree that isn't the
        # committed lock. This mirrors the strict `npm ci` leg below and
        # keeps the gate honest to "audit what ships".
        run: uv export --locked --no-emit-project --format requirements-txt --output-file requirements-audit.txt

      - name: pip-audit (Python deps)
        # Fails the build on any advisory in the locked tree EXCEPT the
        # allowlist below. Keep the list short and time-bound — every
        # entry needs a reason and the follow-up that removes it.
        #
        # GHSA-4xgf-cpjx-pc3j — pydantic-settings 2.14.1 (transitive),
        #   Moderate (CVSS 5.3): symlink escape in
        #   NestedSecretsSettingsSource. Only reachable with
        #   secrets_nested_subdir=True, which this codebase does not use,
        #   so it is not exploitable here. Fixed in 2.14.2, which lands
        #   via the Dependabot uv bump PR — drop this ignore once uv.lock
        #   picks up the new version.
        run: uvx pip-audit -r requirements-audit.txt --ignore-vuln GHSA-4xgf-cpjx-pc3j

      # --- Dashboard: npm audit ---
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_mcp/dashboard/package-lock.json

      - name: npm audit (dashboard deps)
        working-directory: agent_mcp/dashboard
        # Gate on HIGH/CRITICAL only. Moderate/low advisories are surfaced
        # by Dependabot and its bump PRs but must not red the build on the
        # committed lockfile (currently 2 known moderate postcss/next
        # advisories). Raise the threshold here if that tolerance changes.
        run: |
          npm ci
          npm audit --audit-level=high
