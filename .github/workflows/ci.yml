name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo (checkout,
# build, test) and never writes back, so drop the default read/write grant.
permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every CPython release still receiving updates as of the floor
        # bump (3.10 reaches EOL 2026-10-31 and was dropped with it).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        # v7 is the newest moving major tag astral publishes (v8 is
        # release-only for now); both run on node24.
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Cache uv's wheel/download store to cut the cold install.
          # cache-suffix keys the cache per matrix Python so the four
          # jobs don't race to reserve one shared key (setup-uv's
          # default key omits the matrix version — that was the earlier
          # "Unable to reserve cache" warning). Invalidates on
          # pyproject.toml change via the default cache-dependency-glob.
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint (tests/ only)
        # Scope is tests/ for now; agent_mcp/ has 216 pre-existing ruff
        # errors documented in CONTRIBUTING.md. PRs that touch agent_mcp/
        # files clean them up incrementally.
        run: uv run ruff check tests/

      - name: Run pytest
        # `-n auto` (one worker per CPU) is configured in pyproject.toml
        # under [tool.pytest.ini_options] addopts; pytest-xdist comes
        # in via `.[dev]` above. GitHub ubuntu-latest runners give us
        # ~4 cores, which is the sweet spot for this suite.
        run: uv run pytest -v

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_mcp/dashboard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_mcp/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

  nix-flake-check:
    name: Nix flake check (VM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Pinned to a release tag instead of the mutable @main for
      # reproducible runs; v22 runs on node24.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # Resilience: retry transient substituter/network hiccups
          # before giving up, rather than failing the job on the first
          # flaky download from cache.nixos.org. Pairs with --fallback
          # on the build step below.
          extra-conf: |
            download-attempts = 3
            connect-timeout = 10

      # magic-nix-cache is sunset by Determinate Systems (it also spammed
      # an "Unable to authenticate to FlakeHub" annotation on every run)
      # and, when GitHub Actions Cache throttled it, disabled the
      # substituter mid-build and hard-failed the job (HTTP 418 /
      # ResourceExhausted). cache-nix-action save/restores /nix/store via
      # the plain Actions cache API instead, with GC so we stay under the
      # 10 GB per-repo cache budget. No external account or secret needed.
      - name: Cache /nix/store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Save a fresh cache each run (unique run_id suffix) and restore
          # the closest prior one sharing the flake/nix-input hash prefix.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}-${{ github.run_id }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}-
          # Trim the store before saving so the upload stays within budget.
          gc-max-store-size-linux: 5G
          # Keep the cache list bounded: drop older entries sharing our
          # prefix, but never the key we're about to save.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build VM tests
        # Builds only the nixosTest VM checks (vm-single-tenant, vm-multi-tenant)
        # rather than the full `nix flake check`, because the other checks
        # (agent-mcp Python build, agent-mcp-dashboard Next.js build) duplicate
        # the `python` and `dashboard` jobs above. The VM checks exercise the
        # full server boot + HTTP assertions (including the Path A asset-prefix
        # sentinel regression guard from #166) which nothing else covers.
        # First run ~30 min; subsequent runs ~5-10 min via cache-nix-action.
        run: |
          # --fallback: if a binary-cache substitution fails (flaky
          # cache.nixos.org), build that path from source instead of
          # hard-failing the job. With download-attempts=3 above, this
          # makes the job resilient to transient cache failures — the
          # class of flake that sank the old magic-nix-cache setup.
          nix build .#checks.x86_64-linux.vm-single-tenant \
                    .#checks.x86_64-linux.vm-multi-tenant \
                    -L --print-build-logs --fallback
