name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same PR/branch when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        # No enable-cache: we don't ship a uv.lock; the setup-uv cache
        # is keyed off uv.lock and 404s without one. uv pip install -e
        # .[dev] is fast enough that cache wouldn't help much.

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint (tests/ only)
        # Scope is tests/ for now; agent_mcp/ has 216 pre-existing ruff
        # errors documented in CONTRIBUTING.md. PRs that touch agent_mcp/
        # files clean them up incrementally.
        run: uv run ruff check tests/

      - name: Run pytest
        # `-n auto` (one worker per CPU) is configured in pyproject.toml
        # under [tool.pytest.ini_options] addopts; pytest-xdist comes
        # in via `.[dev]` above. GitHub ubuntu-latest runners give us
        # ~4 cores, which is the sweet spot for this suite.
        run: uv run pytest -v

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_mcp/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_mcp/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

  nix-flake-check:
    name: Nix flake check (VM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build VM tests
        # Builds only the nixosTest VM checks (vm-single-tenant, vm-multi-tenant)
        # rather than the full `nix flake check`, because the other checks
        # (agent-mcp Python build, agent-mcp-dashboard Next.js build) duplicate
        # the `python` and `dashboard` jobs above. The VM checks exercise the
        # full server boot + HTTP assertions (including the Path A asset-prefix
        # sentinel regression guard from #166) which nothing else covers.
        # First run ~30 min; subsequent runs ~5-10 min via magic-nix-cache.
        run: |
          nix build .#checks.x86_64-linux.vm-single-tenant \
                    .#checks.x86_64-linux.vm-multi-tenant \
                    -L --print-build-logs
