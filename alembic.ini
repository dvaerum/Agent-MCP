# Alembic configuration for Agent-MCP.
#
# The migrations directory is shipped as `migrations/` at the repo
# root and packaged with the wheel via setuptools data files (see
# pyproject.toml). At runtime, `agent_mcp.db.migrations_runner` builds
# a `Config` object programmatically and points `script_location` at
# the on-disk migrations dir, so the `sqlalchemy.url` here is a
# placeholder — the per-project URL is injected at runtime via
# `Config.set_main_option("sqlalchemy.url", ...)`.
#
# Manual usage from the repo root:
#
#     alembic revision -m "add foo column"
#     alembic upgrade head
#
# Both inherit MCP_PROJECT_DIR from the environment so they target
# the same DB that `init_database()` would.

[alembic]
script_location = %(here)s/agent_mcp/migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder; overridden at runtime by migrations_runner.
sqlalchemy.url = sqlite:///./placeholder.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
