[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mcp"
version = "5.80.0"
description = "AgentMCP v2.5 - Enhanced multi-agent system with tmux integration and worktree support"
authors = [
    {name = "Luis Alejandro Rincon", email = "alejandro@rinconnect.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Phase F (prancy-napping-pie): agent_mcp/ is now schema/ORM/
    # migrations only (the app, router, and tool-catalogue code that
    # needed click/openai/fastapi/starlette/sse-starlette/aiohttp/
    # uvicorn/uvloop/httptools/jinja2/python-dotenv/httpx/requests/mcp/
    # argon2-cffi/authlib is deleted, fully superseded by the Rust
    # conexus-* workspace) -- this list is the real, minimal import
    # surface of what's left, not a snapshot to prune later. Verified
    # by grepping every surviving agent_mcp/**/*.py for its actual
    # top-level imports before trimming, not assumed from memory.
    "anyio",
    "sqlite-vec",
    "sqlalchemy>=2.0",
    "alembic",
    # db/pydantic_mirrors.py uses ConfigDict (pydantic v2 API) --
    # previously reached only transitively via fastapi, never declared
    # directly despite being imported directly.
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # Parallel test execution across CPU cores. The suite pays a
    # ~4s lifespan-startup cost on the first test in each worker
    # (sqlite-vec load + Alembic upgrade + RAG init), but per-test
    # cost is tiny — so splitting across workers wins wall-clock
    # time on multi-core machines. See [tool.pytest.ini_options]
    # below for the default `-n auto` config and override notes.
    "pytest-xdist>=3.0",
    # Pinned exactly: the CI lint gate installs dev deps by
    # re-resolving pyproject (not from uv.lock), so an unpinned ruff
    # reds `main` the moment upstream ships a release that changes the
    # rule set — which is exactly what 0.16.0 did (2026-07-23: default
    # rules went 59 -> 413, taking tests/ from clean to 1021 errors
    # with zero repo changes). Bump this deliberately, in a PR that
    # also clears whatever the new version flags.
    "ruff==0.16.1",
    "black",
    "isort",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_mcp*"]

[tool.setuptools.package-data]
"agent_mcp" = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/README",
    "migrations/versions/*.py",
    # Router-level identity migrations (Phase 1 PR B,
    # prancy-napping-pie). Separate Alembic tree from the per-project
    # migrations/ above — same packaging story.
    "router/migrations/*.py",
    "router/migrations/*.mako",
    "router/migrations/README",
    "router/migrations/versions/*.py",
]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.2",
    # Keep in lockstep with the [project.optional-dependencies] dev pin
    # above — see the rationale there.
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
# `-n auto` runs one worker per CPU. On CI runners (2-4 cores) this
# gives a clean speedup; on big workstations xdist may over-subscribe
# if your suite has heavy per-worker startup — see numbers in the
# pytest-xdist PR description.
#
# Local override for interactive debugging of a single test:
#   pytest -n 0 tests/test_foo.py::test_bar      # serial, no workers
# Or set a fixed worker count:
#   pytest -n 4 tests/                            # 4 workers
addopts = "-n auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
# ... existing code ...

[tool.ruff.lint.isort]
known-first-party = ["agent-mcp"]
# ... existing code ...

# Two rules out of ruff 0.16's expanded default set are wrong for this
# test suite specifically. Everything else in the default set is
# enforced on tests/ (see the CI "Lint (tests/ only)" step).
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # PLR0402 (manual-from-import) rewrites `import pkg.mod as mod`
    # into `from pkg import mod`. Those are NOT equivalent here: a big
    # part of this suite gets a clean module by doing
    # `sys.modules.pop(...)` + `importlib.reload(mod)`, and the
    # `from pkg import mod` form rebinds the stale attribute off the
    # already-imported parent package without repopulating
    # sys.modules — so reload() then raises "module ... not in
    # sys.modules". Applying this rule's fix broke 91 tests across 7
    # files. The `import x.y as y` spelling is load-bearing, not style.
    "PLR0402",
    # DTZ001/DTZ003/DTZ005 (naive datetime constructors). The tests
    # write timestamps that must byte-match what production writes,
    # and agent_mcp/ persists naive local `datetime.now().isoformat()`
    # in ~82 places (task/agent/note rows, retention cutoffs, the
    # scheduler's string-ordered ISO comparisons). Making the tests
    # tz-aware would append "+00:00" and stop them from exercising the
    # real format. Moving production to aware datetimes is a separate,
    # deliberate change; when that lands, drop these three and fix the
    # tests in the same PR.
    "DTZ001",
    "DTZ003",
    "DTZ005",
]
