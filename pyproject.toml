[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mcp"
version = "5.74.0"
description = "AgentMCP v2.5 - Enhanced multi-agent system with tmux integration and worktree support"
authors = [
    {name = "Luis Alejandro Rincon", email = "alejandro@rinconnect.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anyio",
    "click",
    "openai",
    "fastapi",
    "starlette",
    # Battle-tested SSE transport (ping keepalive + disconnect-driven
    # generator cancellation) for the operator live-update stream
    # (GET /api/events). Already present transitively via `mcp`; pinned
    # here as an explicit direct dependency since we import it directly.
    "sse-starlette",
    "uvicorn[standard]",
    "jinja2",
    "python-dotenv",
    "sqlite-vec",
    "httpx",
    "requests",
    # Capped below 2.0: the CI test jobs resolve this range fresh from
    # pyproject (not from uv.lock), and mcp 2.0.0 (2026-07-28) is a
    # breaking major — `mcp.server.lowlevel.server.request_ctx` and the
    # session/transport surfaces this codebase builds on all moved.
    # Lifting the cap is a deliberate migration PR, not a resolver
    # accident. uv.lock pins the in-range version we actually ship.
    # Floor is 1.27.0, not 1.8.1: earlier versions raise an unhandled
    # ClosedResourceError out of the SDK's own task group when a client
    # disconnects mid-request (python-sdk#2306, fixed in 1.27.0). Seen live.
    # nix/packages.nix carries a version-gated override so this floor is
    # satisfiable on channels that still ship 1.26 — the two MUST move
    # together or nixpkgs' pythonRuntimeDepsCheckHook fails the build.
    "mcp>=1.27.0,<2",
    "sqlalchemy>=2.0",
    "alembic",
    # Router-side identity store (Phase 1 PR B of prancy-napping-pie).
    # argon2id is the recommended modern password-hashing scheme; the
    # default PasswordHasher params (time_cost=2, memory_cost=64 MiB,
    # parallelism=4) match OWASP guidance for 2024+.
    "argon2-cffi",
    # SSO via OIDC (Phase 3 Wave 3 of prancy-napping-pie). Authlib's
    # ``integrations.requests_client.OAuth2Session`` gives us a sync
    # client for the authorization-code flow + JWT id-token decode +
    # discovery-document fetch. We only use the sync surface (the
    # aiohttp surface lives under a separate optional dep that pulls
    # ``httpx``); the callback handler runs the token exchange in a
    # thread executor so it doesn't block the event loop.
    "authlib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # pytest-aiohttp gives us the `aiohttp_client` fixture +
    # `TestClient`/`TestServer` glue used by tests/router/ to exercise
    # the vendored aiohttp router (router.py + project_registry.py from
    # the deploy repo, vendored under tests/router/_fixtures/ for
    # Phase 0 of the router-upstream plan).
    "pytest-aiohttp",
    # Parallel test execution across CPU cores. The suite pays a
    # ~4s lifespan-startup cost on the first test in each worker
    # (sqlite-vec load + Alembic upgrade + RAG init), but per-test
    # cost is tiny — so splitting across workers wins wall-clock
    # time on multi-core machines. See [tool.pytest.ini_options]
    # below for the default `-n auto` config and override notes.
    "pytest-xdist>=3.0",
    # Pinned exactly: the CI lint gate installs dev deps by
    # re-resolving pyproject (not from uv.lock), so an unpinned ruff
    # reds `main` the moment upstream ships a release that changes the
    # rule set — which is exactly what 0.16.0 did (2026-07-23: default
    # rules went 59 -> 413, taking tests/ from clean to 1021 errors
    # with zero repo changes). Bump this deliberately, in a PR that
    # also clears whatever the new version flags.
    "ruff==0.16.1",
    "black",
    "isort",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_mcp*"]

[tool.setuptools.package-data]
"agent_mcp" = [
    "py.typed",
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/README",
    "migrations/versions/*.py",
    "prompts/*.json",
    "router/*.in",
    # Router-level identity migrations (Phase 1 PR B,
    # prancy-napping-pie). Separate Alembic tree from the per-project
    # migrations/ above — same packaging story.
    "router/migrations/*.py",
    "router/migrations/*.mako",
    "router/migrations/README",
    "router/migrations/versions/*.py",
    # Router-level login + setup-wizard templates (Phase 1 PR C,
    # prancy-napping-pie). Jinja loads these via FileSystemLoader
    # rooted at agent_mcp/router/templates/.
    "router/templates/*.html",
]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.2",
    # Keep in lockstep with the [project.optional-dependencies] dev pin
    # above — see the rationale there.
    "ruff==0.16.1",
]

[tool.rye.scripts]
# Default run, assumes server mode
run = { cmd = "uv run -m agent-mcp.cli -- server --port 8080 --project-dir ." }
start = { cmd = "uv run -m agent-mcp.cli -- server --port 8080 --project-dir ." }
cli = { cmd = "uv run -m agent-mcp.cli --" }
test = { cmd = "pytest" }
lint = { cmd = "ruff check ." }
format = { cmd = "ruff format ." }
index = { cmd = "uv run -m agent-mcp.features.rag.indexing -- --project-dir ." }

[tool.pytest.ini_options]
# `-n auto` runs one worker per CPU. On CI runners (2-4 cores) this
# gives a clean speedup; on big workstations xdist may over-subscribe
# if your suite has heavy per-worker startup — see numbers in the
# pytest-xdist PR description.
#
# Local override for interactive debugging of a single test:
#   pytest -n 0 tests/test_foo.py::test_bar      # serial, no workers
# Or set a fixed worker count:
#   pytest -n 4 tests/                            # 4 workers
addopts = "-n auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
# ... existing code ...
# Phase 0 of the router-upstream plan vendored two source files into
# tests/router/_fixtures/. They are a one-time verbatim snapshot of the
# deploy repo's router.py + project_registry.py; the whole directory is
# deleted in Phase 1 when those files move to their permanent in-tree
# home. Until then we exclude them from lint so the snapshot stays
# byte-identical to its upstream.
extend-exclude = ["tests/router/_fixtures"]

[tool.ruff.lint.isort]
known-first-party = ["agent-mcp"]
# ... existing code ...

# Two rules out of ruff 0.16's expanded default set are wrong for this
# test suite specifically. Everything else in the default set is
# enforced on tests/ (see the CI "Lint (tests/ only)" step).
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # PLR0402 (manual-from-import) rewrites `import pkg.mod as mod`
    # into `from pkg import mod`. Those are NOT equivalent here: a big
    # part of this suite gets a clean module by doing
    # `sys.modules.pop(...)` + `importlib.reload(mod)`, and the
    # `from pkg import mod` form rebinds the stale attribute off the
    # already-imported parent package without repopulating
    # sys.modules — so reload() then raises "module ... not in
    # sys.modules". Applying this rule's fix broke 91 tests across 7
    # files. The `import x.y as y` spelling is load-bearing, not style.
    "PLR0402",
    # DTZ001/DTZ003/DTZ005 (naive datetime constructors). The tests
    # write timestamps that must byte-match what production writes,
    # and agent_mcp/ persists naive local `datetime.now().isoformat()`
    # in ~82 places (task/agent/note rows, retention cutoffs, the
    # scheduler's string-ordered ISO comparisons). Making the tests
    # tz-aware would append "+00:00" and stop them from exercising the
    # real format. Moving production to aware datetimes is a separate,
    # deliberate change; when that lands, drop these three and fix the
    # tests in the same PR.
    "DTZ001",
    "DTZ003",
    "DTZ005",
]
# PLE2502 (bidirectional-unicode) fires on the RTL-override / BOM /
# zero-width characters this file embeds — they ARE the subject under
# test (it pins that /api/memories rejects spoofable context keys), so
# the file cannot exist without them. Scoped to this one file rather
# than tests/** so the rule keeps guarding every other test. A `noqa`
# is not an option: two of the five hits are inside the module
# docstring, where a trailing comment is just more string content.
"tests/test_memories_unsafe_unicode_key.py" = ["PLE2502"]
