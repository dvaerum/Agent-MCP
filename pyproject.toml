[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mcp"
version = "5.59.0"
description = "AgentMCP v2.5 - Enhanced multi-agent system with tmux integration and worktree support"
authors = [
    {name = "Luis Alejandro Rincon", email = "alejandro@rinconnect.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anyio",
    "click",
    "openai",
    "fastapi",
    "starlette",
    # Battle-tested SSE transport (ping keepalive + disconnect-driven
    # generator cancellation) for the operator live-update stream
    # (GET /api/events). Already present transitively via `mcp`; pinned
    # here as an explicit direct dependency since we import it directly.
    "sse-starlette",
    "uvicorn[standard]",
    "jinja2",
    "python-dotenv",
    "sqlite-vec",
    "httpx",
    "requests",
    "mcp>=1.8.1",
    "sqlalchemy>=2.0",
    "alembic",
    # Router-side identity store (Phase 1 PR B of prancy-napping-pie).
    # argon2id is the recommended modern password-hashing scheme; the
    # default PasswordHasher params (time_cost=2, memory_cost=64 MiB,
    # parallelism=4) match OWASP guidance for 2024+.
    "argon2-cffi",
    # SSO via OIDC (Phase 3 Wave 3 of prancy-napping-pie). Authlib's
    # ``integrations.requests_client.OAuth2Session`` gives us a sync
    # client for the authorization-code flow + JWT id-token decode +
    # discovery-document fetch. We only use the sync surface (the
    # aiohttp surface lives under a separate optional dep that pulls
    # ``httpx``); the callback handler runs the token exchange in a
    # thread executor so it doesn't block the event loop.
    "authlib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # pytest-aiohttp gives us the `aiohttp_client` fixture +
    # `TestClient`/`TestServer` glue used by tests/router/ to exercise
    # the vendored aiohttp router (router.py + project_registry.py from
    # the deploy repo, vendored under tests/router/_fixtures/ for
    # Phase 0 of the router-upstream plan).
    "pytest-aiohttp",
    # Parallel test execution across CPU cores. The suite pays a
    # ~4s lifespan-startup cost on the first test in each worker
    # (sqlite-vec load + Alembic upgrade + RAG init), but per-test
    # cost is tiny — so splitting across workers wins wall-clock
    # time on multi-core machines. See [tool.pytest.ini_options]
    # below for the default `-n auto` config and override notes.
    "pytest-xdist>=3.0",
    "ruff",
    "black",
    "isort",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_mcp*"]

[tool.setuptools.package-data]
"agent_mcp" = [
    "py.typed",
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/README",
    "migrations/versions/*.py",
    "prompts/*.json",
    "router/*.in",
    # Router-level identity migrations (Phase 1 PR B,
    # prancy-napping-pie). Separate Alembic tree from the per-project
    # migrations/ above — same packaging story.
    "router/migrations/*.py",
    "router/migrations/*.mako",
    "router/migrations/README",
    "router/migrations/versions/*.py",
    # Router-level login + setup-wizard templates (Phase 1 PR C,
    # prancy-napping-pie). Jinja loads these via FileSystemLoader
    # rooted at agent_mcp/router/templates/.
    "router/templates/*.html",
]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.2",
    "ruff>=0.5.5",
]

[tool.rye.scripts]
# Default run, assumes server mode
run = { cmd = "uv run -m agent-mcp.cli -- server --port 8080 --project-dir ." }
start = { cmd = "uv run -m agent-mcp.cli -- server --port 8080 --project-dir ." }
cli = { cmd = "uv run -m agent-mcp.cli --" }
test = { cmd = "pytest" }
lint = { cmd = "ruff check ." }
format = { cmd = "ruff format ." }
index = { cmd = "uv run -m agent-mcp.features.rag.indexing -- --project-dir ." }

[tool.pytest.ini_options]
# `-n auto` runs one worker per CPU. On CI runners (2-4 cores) this
# gives a clean speedup; on big workstations xdist may over-subscribe
# if your suite has heavy per-worker startup — see numbers in the
# pytest-xdist PR description.
#
# Local override for interactive debugging of a single test:
#   pytest -n 0 tests/test_foo.py::test_bar      # serial, no workers
# Or set a fixed worker count:
#   pytest -n 4 tests/                            # 4 workers
addopts = "-n auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
# ... existing code ...
# Phase 0 of the router-upstream plan vendored two source files into
# tests/router/_fixtures/. They are a one-time verbatim snapshot of the
# deploy repo's router.py + project_registry.py; the whole directory is
# deleted in Phase 1 when those files move to their permanent in-tree
# home. Until then we exclude them from lint so the snapshot stays
# byte-identical to its upstream.
extend-exclude = ["tests/router/_fixtures"]

[tool.ruff.lint.isort]
known-first-party = ["agent-mcp"]
# ... existing code ...
